<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>思い出 | ファミペディア</title>
  <link rel="stylesheet" href="./style.css" />
  <link rel="stylesheet" href="./memory.css" />
</head>
<body>

<header class="topbar">
  <a class="topbar-brand" href="./people.html" title="記録一覧へ">
    <span class="logo-mark" aria-hidden="true">F</span>
    <span class="logo-text">
      <strong>ファミペディア</strong>
      <small>家族の百科事典</small>
    </span>
  </a>
  <div class="topbar-actions">
    <a href="./people.html" class="link-btn">記録一覧</a>
    <button id="btn-edit" class="link-btn">編集する</button>
    <button id="btn-logout" class="link-btn">ログアウト</button>
  </div>
</header>

<!-- ============================================================
     思い出ページ本体（Wikipediaの記事風）
     ============================================================ -->
<main class="memory-page">
  <article class="doc">
    <h1 class="doc-title" id="memory-title">読み込み中…</h1>
    <p class="doc-from">出典: Famipedia（ファミペディア）</p>

    <!-- 基礎情報ボックス（右上の表） -->
    <aside class="infobox" id="memory-infobox">
      <div class="infobox-title">
        <span id="info-title">—</span>
      </div>

      <figure class="gallery" id="gallery" hidden>
        <img class="gallery__main" id="gallery-main" alt="" />
        <figcaption class="gallery__caption" id="gallery-caption"></figcaption>
        <div class="gallery__thumbs" id="gallery-thumbs"></div>
      </figure>
      <button type="button" class="infobox-photo" id="gallery-empty">
        <span class="photo-hint">写真を追加</span>
      </button>

      <table class="infobox-table">
        <tbody>
          <tr><th>種類</th><td id="info-kind">—</td></tr>
          <tr><th>ゆかり</th><td id="info-related">—</td></tr>
          <tr id="info-aliases-row" hidden><th>別名</th><td id="info-aliases"></td></tr>
        </tbody>
      </table>
    </aside>

    <div class="doc-body" id="memory-body">
      <p class="empty">まだ本文がありません。</p>
    </div>
  </article>
</main>

<div class="toast" id="toast" hidden></div>

<!-- ============================================================
     編集モーダル
     ============================================================ -->
<div class="modal" id="memory-edit-modal" hidden>
  <div class="modal-box modal-box-article" role="dialog" aria-modal="true" aria-labelledby="memory-edit-title">
    <p class="modal-title" id="memory-edit-title">思い出を編集</p>

    <div class="article-edit-list">
      <label class="edit-field">
        <span class="edit-label">タイトル</span>
        <input type="text" id="me-title" class="edit-text" placeholder="例：市民会館" />
      </label>
      <label class="edit-field">
        <span class="edit-label">よみがな（省略可）</span>
        <input type="text" id="me-reading" class="edit-text" placeholder="例：しみんかいかん" />
      </label>
      <label class="edit-field">
        <span class="edit-label">別の呼び名（「、」で区切る・省略可）</span>
        <input type="text" id="me-aliases" class="edit-text" placeholder="例：公民館、会館" />
        <span class="edit-hint">記事の中にタイトルや別の呼び名が出てくると、自動でこのページへのリンクになります。</span>
      </label>
      <label class="edit-field">
        <span class="edit-label">種類（省略可）</span>
        <input type="text" id="me-kind" class="edit-text" placeholder="例：市民公民館、公園、お店" />
      </label>
      <label class="edit-field">
        <span class="edit-label">ゆかり（省略可）</span>
        <input type="text" id="me-related" class="edit-text" placeholder="例：田中家" />
      </label>
      <label class="edit-field">
        <span class="edit-label">本文</span>
        <textarea id="me-body" class="edit-text" rows="7"
          placeholder="例：市民会館は、田中家の近くにある市民公民館である。花子と夏子が毎年ピアノの発表会で使用していた。"></textarea>
        <span class="edit-hint">改行すると段落が分かれます。</span>
      </label>

      <div class="edit-field">
        <span class="edit-label">写真（最大 <span id="photo-max"></span> 枚）</span>
        <ul class="photo-editor" id="photo-editor"></ul>
        <button type="button" class="btn photo-add" id="photo-add">＋ 写真を追加</button>
        <input type="file" id="photo-input" accept="image/*" multiple hidden />
      </div>
    </div>

    <div class="modal-actions">
      <button type="button" class="btn" id="me-cancel">やめる</button>
      <button type="button" class="btn btn-primary" id="me-save">保存する</button>
    </div>
  </div>
</div>

<script type="module" src="./src/memory.ts"></script>
</body>
</html>
