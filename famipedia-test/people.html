<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>記録一覧 | ファミペディア</title>
  <link rel="stylesheet" href="./style.css" />
  <link rel="stylesheet" href="./people.css" />
</head>
<body>

<header class="topbar">
  <a class="topbar-brand" href="./people.html" title="記録一覧へ">
    <span class="logo-mark" aria-hidden="true">F</span>
    <span class="logo-text">
      <strong>ファミペディア</strong>
      <small>家族の百科事典</small>
    </span>
  </a>
  <div class="topbar-actions">
    <button id="btn-logout" class="link-btn">ログアウト</button>
  </div>
</header>

<main class="people-page">
  <section class="new-person-section" aria-labelledby="new-person-title">
    <h2 class="people-title" id="new-person-title">新規登録</h2>
    <form id="new-person-form" class="new-person">
      <label class="sr-only" for="new-person-name">新しく記録する人の名前、または思い出のタイトル</label>
      <input
        type="text"
        id="new-person-name"
        placeholder="例：田中 一郎、市民会館（あとで変えられます）"
      />
      <button type="submit" class="btn btn-primary">＋ 新しく記録する</button>
    </form>
  </section>

  <h1 class="people-title">記録一覧</h1>
  <p class="people-lead">記録したい人や思い出を選んでください。</p>

  <div id="people-list" class="people-list">
    <p class="empty">読み込み中…</p>
  </div>
</main>

<!-- 各記録の ⋯ から開くメニュー。people.ts が押された ⋯ の下に動かす -->
<div class="person-menu" id="person-menu" role="menu" hidden>
  <button type="button" class="person-menu__item" id="menu-share" role="menuitem">共有</button>
  <button type="button" class="person-menu__item person-menu__item--danger" id="menu-delete" role="menuitem">削除</button>
</div>

<!-- 「＋ 新しく記録する」を押したあとに、何のページを作るか選ぶ -->
<div class="modal" id="type-modal" hidden>
  <div class="modal-box wiki-dialog" role="dialog" aria-modal="true"
    aria-labelledby="type-title" aria-describedby="type-lead">
    <p class="wiki-dialog__title" id="type-title">何を記録しますか？</p>
    <p class="wiki-dialog__text" id="type-lead"></p>
    <div class="type-choices">
      <button type="button" class="type-choice" data-type="person">
        <span class="type-choice__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="8" r="4"></circle>
            <path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"></path>
          </svg>
        </span>
        <span class="type-choice__body">
          <span class="type-choice__name">人物</span>
          <span class="type-choice__desc">おじいちゃん・おばあちゃんなど。質問に答えていくと、その人の記事ができます。</span>
        </span>
      </button>
      <button type="button" class="type-choice" data-type="memory">
        <span class="type-choice__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 21s-7-6.1-7-11.5A7 7 0 0 1 19 9.5C19 14.9 12 21 12 21z"></path>
            <circle cx="12" cy="9.5" r="2.5"></circle>
          </svg>
        </span>
        <span class="type-choice__body">
          <span class="type-choice__name">思い出</span>
          <span class="type-choice__desc">近所の公園やお店、行事など。写真と文章で、家族の思い出のページを作れます。</span>
        </span>
      </button>
    </div>
    <div class="wiki-dialog__actions">
      <button type="button" class="wiki-btn" id="type-cancel">キャンセル</button>
    </div>
  </div>
</div>

<!-- 削除の確認ダイアログ -->
<div class="modal" id="delete-modal" hidden>
  <div class="modal-box wiki-dialog" role="alertdialog" aria-modal="true"
    aria-labelledby="delete-title" aria-describedby="delete-text">
    <p class="wiki-dialog__title" id="delete-title">記録の削除</p>
    <p class="wiki-dialog__text" id="delete-text"></p>
    <div class="wiki-dialog__actions">
      <button type="button" class="wiki-btn" id="delete-cancel">キャンセル</button>
      <button type="button" class="wiki-btn wiki-btn--destructive" id="delete-ok">削除する</button>
    </div>
  </div>
</div>

<script type="module" src="./src/people.ts"></script>
</body>
</html>
